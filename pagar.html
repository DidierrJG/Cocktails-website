                    <svg xmlns="http://www.w3.org/2000/svg" height="32" width="32" viewBox="0 0 640 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="rgb(255, 255, 255)" d="M24-16C10.7-16 0-5.3 0 8S10.7 32 24 32l45.3 0c3.9 0 7.2 2.8 7.9 6.6l52.1 286.3c6.2 34.2 36 59.1 70.8 59.1L456 384c13.3 0 24-10.7 24-24s-10.7-24-24-24l-255.9 0c-11.6 0-21.5-8.3-23.6-19.7l-5.1-28.3 303.6 0c30.8 0 57.2-21.9 62.9-52.2L568.9 69.9C572.6 50.2 557.5 32 537.4 32l-412.7 0-.4-2c-4.8-26.6-28-46-55.1-46L24-16zM208 512a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm224 0a48 48 0 1 0 0-96 48 48 0 1 0 0 96z"/></svg>

            </a>
        </nav>
    </header>
    <main>
        <h1>
            Finalizar Compra
        </h1>
        <section>
            <form>
                <div id="pay">
                    <svg xmlns="http://www.w3.org/2000/svg" height="32" width="32" viewBox="0 0 640 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="rgb(255, 255, 255)" d="M160 80c0-35.3 28.7-64 64-64s64 28.7 64 64l0 48-128 0 0-48zm-48 48l-64 0c-26.5 0-48 21.5-48 48L0 384c0 53 43 96 96 96l256 0c53 0 96-43 96-96l0-208c0-26.5-21.5-48-48-48l-64 0 0-48c0-61.9-50.1-112-112-112S112 18.1 112 80l0 48zm24 48a24 24 0 1 1 0 48 24 24 0 1 1 0-48zm152 24a24 24 0 1 1 48 0 24 24 0 1 1 -48 0z"/></svg>
                    <h2>
                        Cocktail Pay
                    </h2>
                </div>
                <div>
                    <label for="nombre">
                        Nombre
                    </label>
                    <input id="nombre" name="nombre" type="text" required placeholder="John Doe">
                </div>
                <div>
                    <label for="medio-pago">
                        Medio de pago
                    </label>
                    <select name="medio-pago" id="medio-pago">
                        <option value="tarjeta">
                            Tarjeta
                        </option>
                        <option value="pse">
                            PSE
                        </option>
                        <option value="bitcoin">
                            Bitcoin
                        </option>
                    </select>
                </div>
                <div>
                    <label for="email">
                        Email
                    </label>
                    <input id="email" name="email" type="email" required placeholder="johndoe@gmail.com">
                </div>
                <div>
                    <label for="direccion">
                        Direccion
                    </label>
                    <input id="direccion" name="direccion" type="text" required placeholder="Avenida Siempre Viva">
                </div>
            </form>
        </section>
    </main>
    <footer>
        © 2026 DidierrJG
    </footer>
    <script src="js/pagar.js"></script>
</body>
</html>
